name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title"
        required: true
        type: string
      issue_numbers:
        description: "Issue numbers (comma-separated, e.g. #12, #34)"
        required: false
        type: string
        default: ""
      pr_number:
        description: "Associated PR number (e.g. #56)"
        required: false
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: msi
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: dmg

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl -y

      - name: Install npm dependencies
        run: npm ci

      - name: Sync version from package.json to Tauri
        run: node -e "const fs=require('fs'),v=JSON.parse(fs.readFileSync('package.json','utf8')).version;console.log('Syncing version:',v);const tc=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));tc.version=v;fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(tc,null,2)+'\n');const c=fs.readFileSync('src-tauri/Cargo.toml','utf8');fs.writeFileSync('src-tauri/Cargo.toml',c.replace(/^version = \"[^\"]*\"/m,'version = \"'+v+'\"'))"

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.ext }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.ext }}/*.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version from package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
          digest-mismatch: warn

      - name: Build release body
        id: body
        run: |
          body="${{ inputs.title }}"
          if [ -n "${{ inputs.issue_numbers }}" ]; then
            body="${body}\n\nIssues: ${{ inputs.issue_numbers }}"
          fi
          if [ -n "${{ inputs.pr_number }}" ]; then
            body="${body}\n\nPR: ${{ inputs.pr_number }}"
          fi
          {
            echo "body<<EOF"
            echo -e "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Display artifact structure
        run: find artifacts -type f -ls

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ inputs.title }}
          body: ${{ steps.body.outputs.body }}
          files: artifacts/*
          draft: false
          prerelease: false
